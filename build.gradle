plugins {
	id "java"
}

dependencies {
	implementation project(":base")
	implementation project(":annotations")
	
	implementation "org.ow2.asm:asm-commons:${ASM}"
	implementation "com.google.guava:guava:${GoogleGuava}"
	implementation "org.apache.logging.log4j:log4j-api:${Log4jAPI}"
	implementation "org.apache.logging.log4j:log4j-core:${Log4jCore}"
	implementation "org.apache.commons:commons-lang3:${ApacheLang}"
}

allprojects {
	apply plugin: "java"
	
	repositories {
		mavenCentral()
		maven {
			url "https://maven.luis-st.net/libraries/"
		}
	}
	
	dependencies {
		implementation "net.luis:LUtils:${LUtils}"
		implementation "org.ow2.asm:asm:${ASM}"
		implementation "org.jetbrains:annotations:${JetBrainsAnnotations}"
	}
}

tasks.register("run", JavaExec) {
	dependsOn project(":agent").build
	group = "run"
	classpath = sourceSets.main.runtimeClasspath
	getMainClass().set("net.luis.Main")
	jvmArgs("-javaagent:${projectDir}/agent/build/libs/agent.jar")
}

tasks.register("testing", JavaExec) {
	dependsOn project(":agent").build
	group = "run"
	classpath += sourceSets.main.runtimeClasspath
	classpath += project(":agent").sourceSets.main.runtimeClasspath
	getMainClass().set("net.luis.Testing")
}

compileJava {
	options.compilerArgs << "-parameters"
}
